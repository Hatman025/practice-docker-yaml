name: Microservices Tigger CI

on:
  push:
  workflow_dispatch: 
permissions: 
  contents: read
  packages: write
jobs:
  build:
    strategy:
      matrix:
        service:
          - frontend
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
          - shoppingassistantservice
    uses: ./.github/workflows/microservice-ci.yaml
    with:
      service: ${{ matrix.service }}
    
