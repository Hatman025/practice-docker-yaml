name: microservice CI

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    env:
          SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "$SERVICE"
      - run: docker build -t "$SERVICE" "./src/$SERVICE"
        
